<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <div class="container">
        <header>
            <div class="title">NEXUS ORACLE // METAMATRIX</div>

                <span id="sync-status" class="status-dot green"></span>

        <div class="security-panel">
            <div class="panel-label">INTEGRITY CHECK</div>

            </div>
        </div>

        <div class="console-panel">
            <div class="panel-label">LIVE TELEMETRY</div>
            <div id="terminal-output" class="terminal">
                <div class="line">> Initializing sovereign cortex...</div>
                <div class="line">> Awaiting local oracle payload...</div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
